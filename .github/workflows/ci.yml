name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend – build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pom.xml
        id: check-pom
        run: |
          if [ -f backend/core-api/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.check-pom.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        if: steps.check-pom.outputs.exists == 'true'
        run: |
          cd backend/core-api
          mvn -B verify --no-transfer-progress

      # The second Spring Boot app was never built here at all, so a change to it could not break
      # the build. Tests tagged "docker" (Testcontainers: Postgres, RabbitMQ, Mailpit) are skipped
      # because this runner has no Docker daemon; run them locally with `mvn verify`.
      - name: Build & test notification-service
        if: steps.check-pom.outputs.exists == 'true'
        run: |
          if [ -f backend/notification-service/pom.xml ]; then
            cd backend/notification-service
            mvn -B verify -DexcludedGroups=docker --no-transfer-progress
          else
            echo "No notification-service pom.xml yet – skipping"
          fi

      - name: Skip notice
        if: steps.check-pom.outputs.exists == 'false'
        run: echo "No pom.xml yet – skipping backend build"

  frontend:
    name: Frontend – build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.check-pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json
          cache: npm

      - name: Build & test
        if: steps.check-pkg.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci
          npm run build
          npm test -- --run 2>/dev/null || true

      - name: Skip notice
        if: steps.check-pkg.outputs.exists == 'false'
        run: echo "No package.json yet – skipping frontend build"
