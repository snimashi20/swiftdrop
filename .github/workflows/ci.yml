name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend – build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pom.xml
        id: check-pom
        run: |
          if [ -f backend/core-api/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Must match <java.version> in both poms and the Temurin 21 base images
      # used by backend/*/Dockerfile. Do not bump without bumping those too.
      - name: Set up Java 21
        if: steps.check-pom.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify`, not `package`: both poms bind jacoco:report to the verify
      # phase, so `package` would run tests but produce no coverage report.
      - name: Build & test core-api
        if: steps.check-pom.outputs.exists == 'true'
        env:
          DOCKER_API_VERSION: "1.44"
        run: |
          cd backend/core-api
          mvn -B clean verify --no-transfer-progress

      - name: Upload core-api coverage report
        if: always() && steps.check-pom.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-core-api
          path: backend/core-api/target/site/jacoco
          if-no-files-found: warn

      - name: Check for notification-service pom.xml
        id: check-ns-pom
        run: |
          if [ -f backend/notification-service/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & test notification-service
        if: steps.check-ns-pom.outputs.exists == 'true'
        env:
          DOCKER_API_VERSION: "1.44"
        run: |
          cd backend/notification-service
          mvn -B clean verify --no-transfer-progress

      - name: Upload notification-service coverage report
        if: always() && steps.check-ns-pom.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-notification-service
          path: backend/notification-service/target/site/jacoco
          if-no-files-found: warn

      - name: Skip notice
        if: steps.check-pom.outputs.exists == 'false'
        run: echo "No pom.xml yet – skipping backend build"

  frontend:
    name: Frontend – build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.check-pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json
          cache: npm

      - name: Build & test
        if: steps.check-pkg.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci
          npm run build
          npm test

      - name: Skip notice
        if: steps.check-pkg.outputs.exists == 'false'
        run: echo "No package.json yet – skipping frontend build"
