apiVersion: v1
kind: Service
metadata:
  name: core-api-service
  namespace: swiftdrop
  labels:
    app: core-api
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: core-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: swiftdrop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core-api
          image: swiftdrop-core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_URL
              value: "jdbc:postgresql://postgres-service:5432/swiftdrop"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: MAIL_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: GOOGLE_CLIENT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
