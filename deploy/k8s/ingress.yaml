apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftdrop-ingress
  namespace: swiftdrop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "core-api-service"
spec:
  ingressClassName: nginx
  rules:
    - host: swiftdrop.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core-api-service
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: core-api-service
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: core-api-service
                port:
                  number: 8080
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: core-api-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    - host: mock-store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mock-merchant-service
                port:
                  number: 8085

    - host: mailpit.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit-service
                port:
                  number: 8025
