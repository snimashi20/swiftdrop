apiVersion: v1
kind: Service
metadata:
  name: mock-merchant-service
  namespace: swiftdrop
  labels:
    app: mock-merchant-store
spec:
  ports:
    - port: 8085
      targetPort: 8085
      name: http
  selector:
    app: mock-merchant-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-merchant-store
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-merchant-store
  template:
    metadata:
      labels:
        app: mock-merchant-store
    spec:
      containers:
        - name: mock-merchant-store
          image: swiftdrop-mock-store:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: MOCK_MERCHANT_WEBHOOK_SECRET
              value: "dev-webhook-secret-key-12345"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 15
