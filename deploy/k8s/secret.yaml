apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secret
  namespace: swiftdrop
type: Opaque
stringData:
  POSTGRES_USER: "swiftdrop"
  POSTGRES_PASSWORD: "swiftdrop_secure_password"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
  JWT_SECRET: "swiftdrop-jwt-super-secret-key-at-least-256-bits-long-production-grade"
  GOOGLE_CLIENT_ID: "sample-google-client-id"
  GOOGLE_CLIENT_SECRET: "sample-google-client-secret"
