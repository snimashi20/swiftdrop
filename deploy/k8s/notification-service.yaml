apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: swiftdrop
  labels:
    app: notification-service
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: swiftdrop-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: DB_URL
              value: "jdbc:postgresql://postgres-service:5432/swiftdrop"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: MAIL_PORT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
