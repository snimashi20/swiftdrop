apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swiftdrop.fullname" . }}-secret
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | quote }}
  JWT_SECRET: {{ .Values.coreApi.jwtSecret | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.coreApi.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.coreApi.googleClientSecret | quote }}
