{{- if .Values.notificationService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.notificationService.port }}
      targetPort: 8081
      name: http
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swiftdrop.fullname" . }}-notification-service
  labels:
    app: notification-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.notificationService.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: DB_URL
              value: "jdbc:postgresql://postgres-service:5432/{{ .Values.database.name }}"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-config
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftdrop.fullname" . }}-config
                  key: MAIL_PORT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 15
{{- end }}
