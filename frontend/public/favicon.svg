<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SwiftDrop favicon">
<title>SwiftDrop – fast parcel delivery</title>
<!-- Navy site palette tile -->
<rect width="64" height="64" rx="14" fill="#12252B"/>
<!-- Bold mint parcel: readable down to 16 pixels -->
<path d="M17 25.5 32 17 47 25.5 V43 L32 51 17 43 Z" fill="#C9E8D5"/>
<!-- Subtle parcel fold creates recognisable three-dimensional box -->
<path d="M17 25.5 32 34 47 25.5" fill="none" stroke="#12252B" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M32 34 V51" fill="none" stroke="#12252B" stroke-width="2.6"/>
<!-- Terracotta packing tape is the distinctive SwiftDrop brand accent -->
<path d="M27.5 19.6 32 17 36.5 19.6 36.5 31.4 32 29 27.5 31.4 Z" fill="#C25D47"/>
</svg>
