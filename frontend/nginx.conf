server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # AI assistant goes to ai-assistant
    location /api/v1/ai/ {
        proxy_pass http://ai-assistant:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # REST API goes to core-api
    location /api/ {
        proxy_pass http://core-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (STOMP) goes to core-api
    location /ws {
        proxy_pass http://core-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;         # <-- FIXED: was $upgrade
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
