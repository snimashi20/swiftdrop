server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required so the upstream names below are
    # re-resolved at request time instead of being cached at startup:
    # without it nginx pins the container IP it saw when it booted, and
    # every `docker compose up` that reshuffles IPs causes 502s until
    # this container is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # AI assistant
    location /api/v1/ai/ {
        set $ai_upstream http://ai-assistant:8083;
        proxy_pass $ai_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Notifications service (added in 6beaadd)
    location /api/v1/notifications {
        set $notif_upstream http://notification-service:8081;
        proxy_pass $notif_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # REST API (core-api)
    location /api/ {
        set $api_upstream http://core-api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket (STOMP)
    location ~ ^/ws(/|$) {
        set $ws_upstream http://core-api:8080;
        proxy_pass $ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # OAuth2 (Google login) - added in bc152ae
    location /oauth2/ {
        set $oauth_upstream http://core-api:8080;
        proxy_pass $oauth_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /login/oauth2/ {
        set $oauth_cb_upstream http://core-api:8080;
        proxy_pass $oauth_cb_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # React routes
    location / {
        try_files $uri /index.html;
    }
}
