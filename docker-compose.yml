services:
  postgres:
    image: postgres:16
    container_name: swiftdrop-postgres
    environment:
      # Defaults so this container always starts, even when .env only carries the shared
      # cloud DB settings. Without them POSTGRES_PASSWORD is empty, postgres refuses to
      # initialise, and every service that waits on it never starts either.
      POSTGRES_DB: ${POSTGRES_DB:-swiftdrop}
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiftdrop} -d ${POSTGRES_DB:-swiftdrop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: swiftdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    container_name: swiftdrop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build: ./backend/core-api
    container_name: swiftdrop-core-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      # Flat defaults on purpose: a nested default like ${DB_URL:-...${POSTGRES_DB}} is not
      # expanded reliably across Compose versions, so the fallback is spelled out here and
      # matches the postgres service defaults above.
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/swiftdrop}
      DB_USERNAME: ${DB_USERNAME:-swiftdrop}
      DB_PASSWORD: ${DB_PASSWORD:-swiftdrop_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # core-api owns all migrations. On the shared cloud DB this must point at the session
      # pooler (port 5432). Set it in .env whenever you set DB_URL to the cloud - set both
      # or neither, otherwise migrations land in the local container while the app talks to
      # the cloud.
      DB_MIGRATION_URL: ${DB_MIGRATION_URL:-jdbc:postgresql://postgres:5432/swiftdrop}
      DB_POOL_SIZE: ${CORE_API_DB_POOL_SIZE:-3}
      SPRING_PROFILES_ACTIVE: docker
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  notification-service:
    build: ./backend/notification-service
    container_name: swiftdrop-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      core-api:
        condition: service_healthy
    environment:
      # Flat defaults on purpose: a nested default like ${DB_URL:-...${POSTGRES_DB}} is not
      # expanded reliably across Compose versions, so the fallback is spelled out here and
      # matches the postgres service defaults above.
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/swiftdrop}
      DB_USERNAME: ${DB_USERNAME:-swiftdrop}
      DB_PASSWORD: ${DB_PASSWORD:-swiftdrop_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Defaults to the local Mailpit catcher. Point MAIL_HOST at a real provider in .env to send
      # for real; the value must resolve from inside this container, so "mailpit", not "localhost".
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@swiftdrop.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SwiftDrop}
      JWT_SECRET: ${JWT_SECRET}
      DB_POOL_SIZE: ${NOTIFICATION_DB_POOL_SIZE:-2}
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "8081:8081"

  ai-assistant:
    build: ./backend/ai-assistant
    container_name: swiftdrop-ai-assistant
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      CORE_API_BASE_URL: http://core-api:8080
      AI_ASSISTANT_PORT: 8083
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8083:8083"

  frontend:
    build: ./frontend
    container_name: swiftdrop-frontend
    depends_on:
      - core-api
      - notification-service
      - ai-assistant
    ports:
      - "3000:80"

volumes:
  postgres_data:
