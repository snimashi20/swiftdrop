server:
  port: 8080

spring:
  application:
    name: swiftdrop-core-api

  # --- Database (PostgreSQL) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/swiftdrop}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:swiftdrop_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway manages the schema, Hibernate just validates
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # --- Flyway (Database Migrations) ---
  flyway:
    enabled: true
    out-of-order: true
    baseline-on-migrate: true

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # --- Mail (Mailpit) ---
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # --- Google OAuth2 (M2) ---
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# --- Custom App Properties ---
app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_characters_long_for_security}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# --- Actuator (Health checks for Docker) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# --- Logging ---
logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
    com.swiftdrop: INFO
