spring:
  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    out-of-order: true
    # Migrations run over their own connection. On the shared Supabase database this must be
    # the session pooler (port 5432), not the transaction pooler: Flyway guards against two
    # people migrating at the same time with a session-level pg_advisory_lock, and a
    # transaction pooler can route each statement to a different backend, so the lock would
    # not be held for the duration of the migration. Falls back to DB_URL when unset.
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # We all share one database but work on different feature branches, so the database can
    # contain a migration that your branch does not have yet. Without this, Flyway fails
    # startup with "Detected applied migration not resolved locally" and whoever is on an
    # older branch cannot boot. Schema drift is still caught by hibernate ddl-auto: validate.
    ignore-migration-patterns: "*:missing"

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
