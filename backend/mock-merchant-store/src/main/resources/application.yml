server:
  port: ${PORT:8085}

spring:
  application:
    name: mock-merchant-store

mock-merchant:
  store-name: "Apex Electronics (Mock Merchant Store)"
  webhook-secret: ${WEBHOOK_SECRET:dev-webhook-secret-key-12345}
  endpoint-path: "/api/webhooks/orders"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
