server:
  port: 8081

spring:
  application:
    name: swiftdrop-notification-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:2}
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: false # core-api owns the shared schema and all migrations

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false # failed messages go to the dead-letter queue instead of looping

  # Defaults target Mailpit, which accepts anything without authentication. A real provider such as
  # Gmail needs MAIL_SMTP_AUTH and MAIL_SMTP_STARTTLS set to true along with the credentials; for
  # Gmail the password must be a 16-character App Password, not the account password.
  # The timeouts matter: the RabbitMQ consumer thread blocks on the send, so a provider that stops
  # answering would otherwise stall the queue instead of failing the one notification.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM:noreply@swiftdrop.local}
    # The display name a mail client shows in place of the bare address.
    from-name: ${MAIL_FROM_NAME:SwiftDrop}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
