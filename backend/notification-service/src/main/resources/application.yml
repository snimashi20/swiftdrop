server:
  port: 8081

spring:
  application:
    name: swiftdrop-notification-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: false # core-api owns the shared schema and all migrations

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false # failed messages go to the dead-letter queue instead of looping

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM:noreply@swiftdrop.local}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
